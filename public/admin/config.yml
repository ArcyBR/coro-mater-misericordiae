backend:
  name: github
  repo: ArcyBR/coro-mater-misericordiae
  branch: main
  base_url: https://sveltia-cms-auth.arcangeloiovino.workers.dev 
  auth_endpoint: auth

# Login e caricamento immagini gestiti dal riquadro "Identity" di Netlify:
# la segretaria/corista accede con email e password, senza bisogno di un account GitHub.
publish_mode: simple

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "temi"
    label: "Temi ed eventi"
    label_singular: "Tema"
    folder: "src/content/temi"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "date" }
      - { label: "Riassunto breve", name: "excerpt", widget: "text" }
      - { label: "Foto di copertina", name: "cover", widget: "image", required: false }
      - { label: "Pubblicato", name: "published", widget: "boolean", default: true }
      - label: "Galleria fotografica"
        name: "gallery"
        widget: "list"
        allow_add: true
        summary: "{{fields.caption}}"
        fields:
          - { label: "Foto", name: "image", widget: "image" }
          - { label: "Didascalia (facoltativa)", name: "caption", widget: "string", required: false }
      - label: "Video"
        name: "videos"
        widget: "list"
        allow_add: true
        required: false
        summary: "{{fields.caption}}"
        hint: "Incolla il link di un video YouTube o Vimeo (es. https://www.youtube.com/watch?v=...)"
        fields:
          - { label: "Link del video", name: "url", widget: "string" }
          - { label: "Didascalia (facoltativa)", name: "caption", widget: "string", required: false }
      - { label: "Testo", name: "body", widget: "markdown" }

  - name: "storia"
    label: "Storia (tappe cronologiche)"
    label_singular: "Tappa"
    folder: "src/content/storia"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Titolo della tappa", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "date" }
      - { label: "Pubblicato", name: "published", widget: "boolean", default: true }
      - label: "Collega a un Tema esistente (facoltativo)"
        name: "tema"
        widget: "relation"
        collection: "temi"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        required: false
        hint: "Se questa tappa corrisponde a un Tema già creato, collegalo qui: le sue foto e i suoi video verranno mostrati automaticamente, senza doverli ricaricare."
      - label: "Foto proprie di questa tappa (solo se NON è collegata a un Tema)"
        name: "gallery"
        widget: "list"
        allow_add: true
        required: false
        summary: "{{fields.caption}}"
        fields:
          - { label: "Foto", name: "image", widget: "image" }
          - { label: "Didascalia (facoltativa)", name: "caption", widget: "string", required: false }
      - label: "Video propri di questa tappa (solo se NON è collegata a un Tema)"
        name: "videos"
        widget: "list"
        allow_add: true
        required: false
        summary: "{{fields.caption}}"
        fields:
          - { label: "Link del video", name: "url", widget: "string" }
          - { label: "Didascalia (facoltativa)", name: "caption", widget: "string", required: false }
      - { label: "Racconto", name: "body", widget: "markdown" }

  - name: "pagine"
    label: "Pagine del sito"
    label_singular: "Pagina"
    folder: "src/content/pagine"
    create: false
    delete: false
    identifier_field: title
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - label: "Foto del direttore (solo pagina Chi siamo)"
        name: "directorPhoto"
        widget: "image"
        required: false
        hint: "Compila questo campo solo nella pagina \"Chi siamo\": qui non serve."
      - { label: "Nome del direttore (solo pagina Chi siamo)", name: "directorName", widget: "string", required: false }
      - { label: "Descrizione foto per accessibilità (facoltativa)", name: "directorPhotoAlt", widget: "string", required: false }
      - { label: "Testo", name: "body", widget: "markdown" }

  - name: "impostazioni"
    label: "Impostazioni sito"
    files:
      - name: "home"
        label: "Home page"
        file: "src/content/impostazioni/home.md"
        fields:
          - label: "Immagine di sfondo dell'apertura (facoltativa)"
            name: "heroImage"
            widget: "image"
            required: false
            hint: "Se la lasci vuota, verrà usata automaticamente l'ultima foto caricata in un Tema."
          - { label: "Descrizione dell'immagine (per accessibilità)", name: "heroImageAlt", widget: "string", required: false }
